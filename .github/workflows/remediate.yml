name: Remediate dependency PR

# Manually triggered: Actions -> "Remediate dependency PR" -> Run workflow -> enter PR number.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      dry_run:
        description: Analyse only (no commit, push, or PR comment)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write  # read CI logs; dispatch CI on the fixed branch

concurrency:
  group: remediate-${{ inputs.pr }}

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REMEDIATION_PUSH_TOKEN || github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      HAS_PUSH_TOKEN: ${{ secrets.REMEDIATION_PUSH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT here makes the pushed fix re-trigger CI; github.token pushes don't.
          token: ${{ secrets.REMEDIATION_PUSH_TOKEN || github.token }}
      - name: Check out PR branch
        run: gh pr checkout ${{ inputs.pr }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install PR's pinned test dependencies
        run: pip install -r requirements-test.txt
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Triage and remediate
        run: >
          python tools/remediation/remediate.py
          --repo ${{ github.repository }} --pr ${{ inputs.pr }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Re-run CI on the PR branch
        # Pushes made with github.token don't trigger workflows; workflow_dispatch does. The
        # result shows on the commit and in Actions, but not in the PR's checks list; set
        # REMEDIATION_PUSH_TOKEN for that (then the push itself triggers CI and this is skipped).
        if: ${{ !inputs.dry_run && env.HAS_PUSH_TOKEN != 'true' }}
        run: gh workflow run ci.yml --ref "$(git rev-parse --abbrev-ref HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-report
          path: remediation-report.md
